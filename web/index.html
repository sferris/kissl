<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kissl · Certificate Authority</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/"><span class="mark">K</span><span>kissl</span></a><div class="head-actions"><span id="status" class="muted"></span><button id="api-docs" class="ghost">API docs</button><button id="theme" class="icon" title="Toggle color theme">◐</button><button id="logout" class="ghost hidden">Log out</button></div></header>
<main><section id="login" class="login card"><p class="eyebrow">ADMIN ACCESS</p><h1>Certificate management,<br><span>kept simple.</span></h1><p class="lede">Enter the administrator token configured for this service.</p><form id="login-form"><label>Admin token<input id="token" type="password" required autocomplete="current-password" autofocus></label><button>Sign in →</button></form><p id="login-error" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="hero"><div><p class="eyebrow">OVERVIEW</p><h1>Your certificate infrastructure</h1><p class="lede">Manage lab certificate authorities, server certificates, and API access.</p></div><button id="add-ca">+ New authority</button></div><div id="stats" class="stats"></div>
<div class="section-head"><div><p class="eyebrow">TRUST CHAIN</p><h2>Certificate authorities</h2></div></div><div id="cas" class="grid"></div>
<div class="section-head"><div><p class="eyebrow">INVENTORY</p><h2>Servers</h2></div><div class="section-actions"><button id="add-server" class="secondary">+ Register server</button><button id="add-server-cert">+ New server certificate</button></div></div><div id="servers" class="table card"></div></section></main>
<dialog id="modal"><form method="dialog" class="dialog-head"><h2 id="modal-title"></h2><button class="icon">×</button></form><div id="modal-body"></div></dialog><div id="toast" class="toast hidden"></div>
</body></html>
